payload:
  field: complex-analysis
  term: line integral
  proposed_canonical: contour integral
  section: complex-analysis §8
  evidence: ALWAYS use "contour integral" — NEVER "line integral" when referring to integration in 
    the complex plane.
  why: complex-analysis §8 attaches a qualifier to the prohibition (“when referring to integration 
    in the complex plane”), so the ban is narrower than an unconditional substitution. The compiler 
    represents unconditional pairs only and therefore fails closed. Add the pair to 
    rules/enforcement-allowlist.yaml if the qualifier does not actually narrow the ban.
