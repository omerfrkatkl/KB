- id: anal-harm
  type: theorem
  topic: harmonic
  provenance:
  - source: ca-lectures-2026s
    kind: board
    session: '2026-05-03'
    photo: 03_05_202602.jpeg
  - source: ca-lectures-2026s
    kind: board
    session: '2026-05-03'
    photo: 03_05_202603.jpeg
  title: null
  slots:
    citation_form: the real and imaginary parts of an analytic function are harmonic
      in its domain
    hypotheses:
    - $f(z) = u(x, y) + i v(x, y)$ is analytic in a domain $D$
    conclusion: $u$ and $v$ are harmonic in $D$
    proofs:
    - method: direct
      steps:
      - claim: $u$ and $v$ have continuous partial derivatives of all orders in $D$
        justification:
          kind: by-fact
          fact: an analytic function has derivatives of all orders
      - claim: $u_x = v_y$ and $u_y = -v_x$ in $D$
        justification:
          kind: by-fact
          fact: the Cauchy–Riemann equations hold in $D$
      - claim: $u_(x x) = v_(y x)$ and $u_(y y) = -v_(x y)$
        justification:
          kind: by-computation
      - claim: $v_(x y) = v_(y x)$
        justification:
          kind: by-fact
          fact: the mixed partial derivatives of $v$ are continuous
      - claim: $u$ is harmonic in $D$
        justification:
          kind: by-previous-step
      - claim: $v$ is harmonic in $D$
        justification:
          kind: by-computation
      conclusion: $u$ and $v$ are harmonic in $D$
