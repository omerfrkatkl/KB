    body: $u$ and $v$ are harmonic in $D$ and their first-order partial derivatives
      satisfy the Cauchy–Riemann equations $u_x = v_y$ and $u_y = -v_x$
- id: iff
  type: theorem
  topic: harmonic
  provenance:
  - source: ca-lectures-2026s
    kind: board
    session: '2026-05-03'
    photo: 03_05_202604.jpeg
  - source: ca-lectures-2026s
    kind: board
    session: '2026-05-03'
    photo: 03_05_202609.jpeg
  slots:
    citation_form: a function is analytic in a domain if and only if its imaginary
      part is a harmonic conjugate of its real part there
    hypotheses:
    - $f(z) = u(x, y) + i v(x, y)$ is defined on a domain $D$
    conclusion: $f$ is analytic in $D$ if and only if $v$ is a harmonic conjugate
      of $u$ in $D$
    proofs:
    - method: iff-pair
      forward:
      - claim: $u$ and $v$ are harmonic in $D$
        justification:
          kind: by-ref
          ref: anal-harm
      - claim: the Cauchy–Riemann equations hold in $D$
        justification:
          kind: by-fact
          fact: $f$ is analytic
      backward:
      - claim: $f$ is analytic in $D$
        justification:
          kind: by-fact
          fact: the Cauchy–Riemann equations hold and the first-order partial derivatives
            of $u$ and $v$ are continuous
      forward_conclusion: $v$ is a harmonic conjugate of $u$ in $D$
      conclusion: $f$ is analytic in $D$ if and only if $v$ is a harmonic conjugate
        of $u$ in $D$
- id: nonsym
  type: claim
  topic: harmonic
  provenance:
  - source: ca-lectures-2026s
    kind: board
    session: '2026-05-03'
    photo: 03_05_202605.jpeg
  slots:
    citation_form: being a harmonic conjugate is not a symmetric relation
    body: 'being a harmonic conjugate is not a symmetric relation: there exist $u,
      v$ such that $v$ is a harmonic conjugate of $u$ but $u$ is not a harmonic conjugate
      of $v$'
    proofs:
    - method: construction
      setup: the pair $u = x^2 - y^2$, $v = 2 x y$
      steps:
      - claim: $v$ is a harmonic conjugate of $u$ in $CC$
        justification:
          kind: by-fact
          fact: $f(z) = z^2 = (x^2 - y^2) + i(2 x y)$ is analytic in $CC$
      - claim: $g = 2 x y + i(x^2 - y^2)$ fails the Cauchy–Riemann equations off the
          origin
        justification:
          kind: by-computation
      - claim: $g$ is not analytic in any domain
        justification:
          kind: by-ref
          ref: iff
      conclusion: the relation is not symmetric
