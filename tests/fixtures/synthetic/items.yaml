- id: uniq
  type: theorem
  topic: harmonic
  provenance:
  - source: ca-lectures-2026s
    kind: board
    session: '2026-05-03'
    photo: 03_05_202607.jpeg
  slots:
    citation_form: two harmonic conjugates of the same function differ by a constant
    hypotheses:
    - $v_1$ and $v_2$ are harmonic conjugates of $u$ in a domain $D$
    conclusion: $v_1 - v_2$ is constant in $D$
    proofs:
    - method: direct
      steps:
      - claim: $(v_1)_y = u_x = (v_2)_y$ and $(v_1)_x = -u_y = (v_2)_x$
        justification:
          kind: by-definition
          term: harmonic conjugate
          ref: hconj
      - claim: $nabla (v_1 - v_2) = 0$ in $D$
        justification:
          kind: by-computation
      - claim: $v_1 - v_2$ is constant in $D$
        justification:
          kind: by-fact
          fact: a function with vanishing gradient in a domain is constant
      conclusion: the two conjugates differ by a constant
- id: orth
  type: theorem
  topic: harmonic
  provenance:
  - source: ca-lectures-2026s
    kind: board
    session: '2026-05-03'
    photo: 03_05_202608.jpeg
  slots:
    citation_form: the level curves of the real and imaginary parts of an analytic
      function are orthogonal at every point where the derivative is non-zero
    hypotheses:
    - $f = u + i v$ is analytic in a domain $D$
    - $z_0 in D$ and $f'(z_0) != 0$
    conclusion: the level curves $u(x, y) = c_1$ and $v(x, y) = c_2$ through $z_0$
      intersect orthogonally at $z_0$
    proofs:
    - method: direct
      steps:
      - claim: $nabla u dot nabla v = u_x v_x + u_y v_y$
        justification:
          kind: by-computation
      - claim: $nabla u dot nabla v = u_x (-u_y) + u_y u_x = 0$
        justification:
          kind: by-fact
          fact: the Cauchy–Riemann equations hold
      - claim: $nabla u (z_0) != 0$ and $nabla v (z_0) != 0$, and both level curves
          are smooth at $z_0$ with normal vectors $nabla u (z_0)$ and $nabla v (z_0)$
        justification:
          kind: by-fact
          fact: $abs(f')^2 = u_x^2 + u_y^2 = v_x^2 + v_y^2$ and $f'(z_0) != 0$
      - claim: the normal vectors are orthogonal at $z_0$
        justification:
          kind: by-previous-step
      conclusion: the level curves intersect orthogonally at $z_0$
- id: mvp
  type: theorem
  topic: harmonic
  provenance:
  - source: ca-lectures-2026s
    kind: board
    session: '2026-05-03'
    photo: 03_05_202609.jpeg
  slots:
    citation_form: the value of a harmonic function at a point is the mean of its
      values on any sufficiently small circle centred at that point
    hypotheses:
    - $u$ is harmonic in a domain $D$
    - $z_0 in D$
    conclusion: $u(z_0) = 1/(2 pi) integral_0^(2 pi) u(z_0 + r e^(i theta)) dif theta$
      for all sufficiently small $r > 0$
    proofs: []
