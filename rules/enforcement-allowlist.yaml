# AUTHORED — hand-edited, like the rest of rules/. Not generated.
#
# The compiler fails closed: a NEVER whose source sentence attaches a qualifier
# to the prohibition ("for …", "when …", "in …", "without …") compiles to a
# PROPOSAL, not to an enforced substitution — because the compiler can represent
# an unconditional pair and nothing else, so a scoped ban would fire outside its
# scope and rewrite correct text into incorrect text.
#
# An entry here overrides that and keeps the pair enforced. Add one only when the
# qualifier does not actually narrow the ban.
#
# The asymmetry that sets the default: a false demotion costs one queue entry
# that a human clears in seconds. A false enforcement corrupts the corpus, and
# `knowledge-base relint` applies it retroactively to every item already stored.
# When in doubt, leave it off this list.
#
# Fields: term (the banned variant, exactly as quoted in the document),
#         section (as the compiler labels it), reason (one line).

allowlist:
  - term: outward normal derivative
    section: complex-analysis §17.11
    reason: >-
      "in any context" broadens the ban rather than narrowing it, and §17.11 now
      fixes the outward convention explicitly so the unqualified phrase is
      unambiguous everywhere.

  - term: Rouche's Theorem
    section: complex-analysis §17.7
    reason: >-
      "without accent" describes the banned spelling, it does not scope the ban.
      Accent consistency is a core requirement of this corpus, so this pair must
      stay enforced.

  - term: ODE
    section: ode §1.1
    reason: >-
      "in mathematical text" is the whole of what this system writes; every slot
      is mathematical text, so the qualifier excludes nothing.

  - term: PDE
    section: ode §1.1
    reason: >-
      As for ODE: "in mathematical text" describes the only context the corpus
      has.

  # `line integral` (complex-analysis §8) was briefly listed here and was
  # removed on 2026-08-11. The qualifier does narrow the ban: real line
  # integrals appear in this subject, in the Green's theorem step of the
  # Cauchy–Goursat proof, where "line integral" is the correct term. See
  # docs/RULES-CHANGELOG.md. Do not re-add it without that case in hand.

  # ── candidates deliberately NOT listed ──────────────────────────────
  #
  # `principal value` (complex-analysis §3.3) must stay demoted. §3.3 bans it
  # for the logarithm, but §15 mandates "Cauchy principal value of
  # $integral_(-infinity)^(infinity) f(x) dif x$" in full and §17.9 mandates
  # "principal value of $z^c$" — which §17.9 distinguishes from "principal
  # branch of $z^c$" two lines above. Enforcing the pair would not merely
  # damage those phrases, it would collapse two mandated terms that mean
  # different things into one. The conflicting-use check below now catches
  # this without anyone remembering it.
